<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1v1 Lobby — Guess the Road</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --paper: #EDE7D9; --paper-2: #F5F1E6; --paper-line: #C9BFA4;
  --ink: #232A22; --ink-soft: #6B6152;
  --teal: #2F6F62; --teal-deep: #215046;
  --amber: #B8781F; --amber-deep: #935F16;
  --brick: #A23B3B;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; font-family: 'Source Serif 4', Georgia, serif; background:var(--paper); color:var(--ink); }
h1, .title, button { font-family: 'Oswald', 'Arial Narrow', sans-serif; }
.wrap { max-width: 460px; margin: 0 auto; padding: 60px 24px; text-align:center; }
.top-link { display:inline-block; color: var(--ink-soft); font-size:11px; text-decoration:none; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 24px; }
.top-link:hover { color: var(--ink); }
h1 { font-size: 22px; font-weight:700; text-transform:uppercase; margin: 0 0 30px; }
.card { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 8px; padding: 30px 24px; margin-bottom: 18px; }
.eyebrow { font-size: 11px; text-transform:uppercase; letter-spacing:0.1em; color: var(--ink-soft); margin-bottom: 10px; font-family:'Oswald',sans-serif; }
#code-display { font-family:'JetBrains Mono', monospace; font-size: 48px; font-weight:700; letter-spacing: 0.12em; color: var(--amber); margin-bottom: 6px; }
.hint { color: var(--ink-soft); font-size: 13px; }
.players { display:flex; align-items:center; justify-content:center; gap: 18px; margin: 20px 0; }
.player-slot { flex:1; background: var(--paper); border: 1.5px dashed var(--paper-line); border-radius: 6px; padding: 16px 10px; font-size: 14px; }
.player-slot.filled { border-style: solid; border-color: var(--teal); background: #E4EFE9; }
.player-slot .name { font-weight:700; text-transform:uppercase; font-family:'Oswald',sans-serif; font-size:13px; color: var(--teal-deep); }
.vs { font-family:'Oswald',sans-serif; font-weight:700; color: var(--ink-soft); font-size: 13px; }
.status-line { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.05em; font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.dots::after { content: ''; animation: dots 1.4s steps(4,end) infinite; }
@keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }
input[type=text] { width:100%; padding: 12px 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); font-family:'JetBrains Mono',monospace; font-size: 20px; text-align:center; text-transform:uppercase; letter-spacing:0.1em; }
button { cursor: pointer; border: 1.5px solid var(--ink); background: var(--teal); color: #F5F1E6; font-weight:600; border-radius: 6px; padding: 12px 16px; font-size: 13px; text-transform:uppercase; letter-spacing:0.03em; width:100%; margin-top:12px; }
button:hover { background: var(--teal-deep); }
button:disabled { opacity:.4; cursor:default; }
.error { color: var(--brick); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="top-link" href="index.html">&larr; Home</a>
  <h1>1v1 Match</h1>

  <div id="create-view" style="display:none;">
    <div class="card">
      <div class="eyebrow">Your match code</div>
      <div id="code-display">------</div>
      <div class="hint">Give this to your opponent — they enter it on the home screen to join.</div>
      <div class="players">
        <div class="player-slot filled"><div class="name" id="host-name">You</div></div>
        <div class="vs">VS</div>
        <div class="player-slot" id="opponent-slot">Waiting…</div>
      </div>
      <div class="status-line" id="create-status">Waiting for opponent<span class="dots"></span></div>
    </div>
  </div>

  <div id="join-view" style="display:none;">
    <div class="card">
      <div class="eyebrow">Enter match code</div>
      <input type="text" id="join-code-input" maxlength="6" placeholder="ABCXYZ" />
      <button id="join-btn">Join match</button>
      <div class="error" id="join-error"></div>
    </div>
  </div>

  <div id="joined-view" style="display:none;">
    <div class="card">
      <div class="players">
        <div class="player-slot filled"><div class="name" id="host-name-2">Opponent</div></div>
        <div class="vs">VS</div>
        <div class="player-slot filled"><div class="name" id="self-name">You</div></div>
      </div>
      <div class="status-line" id="joined-status">Starting match<span class="dots"></span></div>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const matchId = params.get("match");
  const mode = params.get("as"); // 'host' or absent (join flow)

  const user = await window.SB.getUser();
  if (!user) { location.href = "index.html"; return; }

  function goToGame(id) {
    location.href = `game.html?mode=1v1&match=${id}`;
  }

  if (mode === "host" && matchId) {
    // ---------- host: show code, wait for opponent ----------
    $("create-view").style.display = "block";
    const match = await window.SB.getMatch(matchId);
    if (!match) { $("create-status").textContent = "Match not found."; return; }
    $("code-display").textContent = match.code;

    const profile = await window.SB.getProfile(user.id);
    $("host-name").textContent = profile ? profile.display_name : "You";

    if (match.player_b) {
      const opp = await window.SB.getProfile(match.player_b);
      $("opponent-slot").textContent = opp ? opp.display_name : "Opponent";
      $("opponent-slot").classList.add("filled");
      $("create-status").textContent = "Starting match…";
      setTimeout(() => goToGame(matchId), 1200);
      return;
    }

    window.SB.openMatchChannel(matchId, {
      onRowChange: async (row) => {
        if (row.player_b) {
          const opp = await window.SB.getProfile(row.player_b);
          $("opponent-slot").textContent = opp ? opp.display_name : "Opponent";
          $("opponent-slot").classList.add("filled");
          $("create-status").textContent = "Starting match…";
          setTimeout(() => goToGame(matchId), 1200);
        }
      },
    });
  } else if (matchId) {
    // ---------- already joined via code, just entered ----------
    $("joined-view").style.display = "block";
    const match = await window.SB.getMatch(matchId);
    if (!match) { $("joined-status").textContent = "Match not found."; return; }
    const host = await window.SB.getProfile(match.player_a);
    const self = await window.SB.getProfile(user.id);
    $("host-name-2").textContent = host ? host.display_name : "Opponent";
    $("self-name").textContent = self ? self.display_name : "You";
    setTimeout(() => goToGame(matchId), 1200);
  } else {
    // ---------- no match param: show the "enter code" form ----------
    $("join-view").style.display = "block";
    $("join-btn").addEventListener("click", async () => {
      const code = $("join-code-input").value.trim().toUpperCase();
      $("join-error").textContent = "";
      if (code.length !== 6) { $("join-error").textContent = "Codes are 6 characters."; return; }
      const match = await window.SB.getMatchByCode(code);
      if (!match) { $("join-error").textContent = "No match found with that code."; return; }
      if (match.player_a === user.id) { $("join-error").textContent = "That's your own match — share the code with a friend instead."; return; }
      if (match.player_b && match.player_b !== user.id) { $("join-error").textContent = "That match is already full."; return; }
      const joined = match.player_b === user.id ? match : await window.SB.joinMatch({ matchId: match.id, playerId: user.id });
      if (!joined) { $("join-error").textContent = "Couldn't join — try again."; return; }
      location.href = `lobby.html?match=${joined.id}`;
    });
  }
})();
</script>
</body>
</html>
