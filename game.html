<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Road — Melbourne</title>
<link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --paper: #EDE7D9;         /* base panel background — aged map paper */
  --paper-2: #F5F1E6;       /* lighter card surface */
  --paper-line: #C9BFA4;    /* hairline rules, like a grid ref strip */
  --ink: #232A22;           /* body text */
  --ink-soft: #6B6152;      /* muted / secondary text */
  --teal: #2F6F62;          /* primary accent — map water/park green */
  --teal-deep: #215046;
  --amber: #B8781F;         /* route-marker ochre — score, key highlights */
  --amber-deep: #935F16;
  --brick: #A23B3B;         /* wrong guess / negative */
  --map-bg: #E3DCC8;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; font-family: 'Source Serif 4', Georgia, serif; background:var(--paper); color:var(--ink); }
h1, h2, h3, .display, button, .mode-label, .q-cost, .top-link, .ref-name { font-family: 'Oswald', 'Arial Narrow', sans-serif; }
#app { display:flex; height:100vh; width:100vw; }
#map { flex: 1 1 auto; height:100%; position:relative; background: var(--map-bg); }
#panel { width: 400px; min-width: 360px; background: var(--paper); border-left: 2px solid var(--ink); display:flex; flex-direction: column; height: 100%; overflow: hidden; }
.panel-section { padding: 16px 20px; border-bottom: 1px solid var(--paper-line); }
.top-link { color: var(--ink-soft); font-size:11px; text-decoration:none; text-transform: uppercase; letter-spacing: 0.08em; }
.top-link:hover { color: var(--ink); }
h1 { font-size: 20px; font-weight:600; margin: 6px 0 2px 0; letter-spacing:0.3px; text-transform: uppercase; }
.subtitle, .mode-label { color: var(--teal-deep); font-size: 12px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }

/* --- lobby sidebar: players + live scores, shown in mode=lobby only --- */
#lobby-panel { display:none; width: 240px; min-width: 220px; background: var(--paper); border-right: 2px solid var(--ink); flex-direction: column; height: 100%; overflow: hidden; }
#lobby-panel-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--paper-line); }
#lobby-round-label { font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color: var(--teal-deep); }
#lobby-players-label { font-size:10.5px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; }
#lobby-leaderboard { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px; }
#lobby-leave-wrap { padding: 12px 14px; border-top: 1px solid var(--paper-line); }
.lb-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 8px; border-radius:5px; font-size:13px; }
.lb-row.me { font-weight:700; background: var(--paper-2); }
.lb-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-live { font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
.lb-live.negative { color: var(--brick, #a23b3b); }
.lb-kick { border:none; background:none; cursor:pointer; color: var(--brick, #a23b3b); font-size:13px; padding:0 2px; line-height:1; flex:0 0 auto; }
.lb-kick:hover { opacity:.7; }

/* --- score readout: the signature element --- */
#score-block { background: var(--ink); border-radius: 6px; padding: 14px 16px; margin-top:4px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
#score { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 700; line-height:1; color: var(--amber); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
#score.negative { color: #E08585; }
.score-label { color: #A6A08E; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; margin-top:4px; }

button { font-family: 'Oswald', sans-serif; cursor: pointer; border: 1.5px solid var(--ink); background: var(--paper-2); color: var(--ink); border-radius: 5px; padding: 10px 14px; font-size: 13px; font-weight:500; text-transform: uppercase; letter-spacing: 0.03em; transition: background .12s, transform .06s; }
button:hover:not(:disabled) { background: #E7E0CC; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background: var(--teal); border-color: var(--teal); color: #F5F1E6; font-weight:600; }
button.primary:hover:not(:disabled) { background: var(--teal-deep); }
button.small { padding:6px 10px; font-size:11px; background: transparent; border-color: var(--paper-line); color: var(--ink-soft); }
button.small:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
button.full { width:100%; }
#guess-ref { background: var(--amber); border-color: var(--amber-deep); color: #241704; font-weight:700; }
#guess-ref:hover:not(:disabled) { background: var(--amber-deep); }

input[type=text] { width:100%; padding: 10px 12px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--paper-2); color: var(--ink); font-family:'Source Serif 4', serif; font-size: 14px; }
input[type=text]:focus { outline: 2px solid var(--teal); outline-offset: -1px; }
.row { display:flex; gap:8px; }
.row > * { flex:1; }
.ref-name { font-weight:600; font-size:15px; margin: 2px 0 12px 0; text-transform: uppercase; letter-spacing:0.02em; color: var(--teal-deep); }
.q-cost { color: var(--ink-soft); font-size:10px; display:block; margin-top:2px; letter-spacing:0.02em; }
#search-results { max-height: 220px; overflow-y: auto; margin-top: 8px; display:flex; flex-direction:column; gap:4px; }
.result-item { padding: 9px 11px; border-radius: 5px; background: var(--paper-2); border: 1px solid var(--paper-line); cursor:pointer; font-size: 13.5px; }
.result-item:hover { border-color: var(--teal); }
.result-item .rname { font-weight:600; font-family:'Oswald',sans-serif; }
.result-item .rsub { color: var(--ink-soft); font-size: 11px; margin-top:2px; }
#log { flex: 1 1 auto; overflow-y: auto; padding: 12px 20px; display:flex; flex-direction: column-reverse; gap: 8px; }
.log-entry { font-size: 12.5px; line-height:1.4; padding: 9px 11px; border-radius:5px; background: var(--paper-2); border-left:3px solid var(--paper-line); }
.log-entry .q { color: var(--ink-soft); }
.log-entry .a { font-weight:700; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12px; letter-spacing:0.02em; }
.a.neg { color: var(--brick); }
#status-banner { display:none; padding: 16px 20px; text-align:center; font-weight:700; font-size: 15px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em; }
#status-banner.win { display:block; background: var(--teal); color: #F5F1E6; border-bottom: 2px solid var(--ink); }
#loading-banner { display:block; padding: 16px 20px; text-align:center; font-weight:500; font-size: 13px; color: var(--ink-soft); font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.05em; }
.maplibregl-popup-content { background: var(--paper-2); color: var(--ink); border-radius:5px; font-size:13px; padding: 11px 13px; border:1.5px solid var(--ink); box-shadow:none; font-family:'Source Serif 4',serif; }
.maplibregl-popup-tip { border-top-color:var(--paper-2) !important; border-bottom-color:var(--paper-2) !important; }
.popup-name { font-weight:700; margin-bottom:2px; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; }
.popup-sub { color: var(--ink-soft); font-size:11px; margin-bottom:8px; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 4px; }
.hint { color:var(--ink-soft); font-size:11px; margin-top:6px; }

/* --- lobby results overlay, shown once every round is done --- */
#results-overlay { display:none; position:fixed; inset:0; background: rgba(35,42,34,0.72); z-index:50; align-items:center; justify-content:center; padding:24px; }
#results-overlay.show { display:flex; }
#results-card { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 10px; width: 100%; max-width: 420px; max-height: 86vh; overflow-y:auto; box-shadow: 4px 6px 0 var(--ink); }
#results-card-header { padding: 24px 24px 16px; text-align:center; border-bottom: 1px solid var(--paper-line); }
#results-trophy { font-size: 36px; line-height:1; margin-bottom: 8px; }
#results-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:0.03em; }
#results-winner { color: var(--teal-deep); font-size:13px; margin-top:6px; }
#results-list { padding: 14px 18px; display:flex; flex-direction:column; gap:6px; }
.result-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; background: var(--paper); }
.result-row.first { background: var(--amber); border: 1.5px solid var(--amber-deep); }
.result-row.first .result-name, .result-row.first .result-rank, .result-row.first .result-score { color: #241704; }
.result-rank { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; width: 22px; flex:0 0 auto; color: var(--ink-soft); }
.result-name { flex: 1 1 auto; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.result-score { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; font-variant-numeric: tabular-nums; }
#results-actions { padding: 16px 24px 24px; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="lobby-panel">
    <div id="lobby-panel-header">
      <div id="lobby-round-label">Round — / —</div>
      <div id="lobby-players-label">Players</div>
    </div>
    <div id="lobby-leaderboard"></div>
    <div id="lobby-leave-wrap">
      <button class="small full" id="leave-lobby-btn">Leave game</button>
    </div>
  </div>
  <div id="panel">
    <div id="status-banner"></div>
    <div id="loading-banner">Loading road data…</div>
    <div class="panel-section">
      <a class="top-link" href="index.html">&larr; Home</a>
      <h1>Guess the Road</h1>
      <div class="mode-label" id="mode-label">—</div>
      <div id="score-block">
        <div><div id="score">0</div><div class="score-label">Points remaining</div></div>
        <button class="small" id="reset-btn" disabled>New game</button>
      </div>
    </div>
    <div class="panel-section" id="search-section">
      <input type="text" id="search-input" placeholder="Search for a road (to question or guess)..." autocomplete="off" disabled />
      <div id="search-results"></div>
    </div>
    <div class="panel-section" id="ref-section" style="display:none;">
      <div class="ref-name" id="ref-name">—</div>
      <div class="row" style="margin-bottom:8px;">
        <button id="ask-ns">N / S / Intersect <span class="q-cost" id="cost-ns"></span></button>
        <button id="ask-ew">E / W / Intersect <span class="q-cost" id="cost-ew"></span></button>
      </div>
      <div class="row">
        <button id="guess-ref" class="full">Guess this is the target <span class="q-cost" id="cost-guess"></span></button>
      </div>
    </div>
    <div id="log"></div>
  </div>
  <div id="results-overlay">
    <div id="results-card">
      <div id="results-card-header">
        <div id="results-trophy">🏁</div>
        <div id="results-title">Lobby complete</div>
        <div id="results-winner"></div>
      </div>
      <div id="results-list"></div>
      <div id="results-actions">
        <button class="full primary" id="results-home-btn">Back to home</button>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/game.js"></script>

</body>
</html>
